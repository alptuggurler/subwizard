[project]
name = "subwizard"
version = "0.1.0"
description = "Live game subtitle translator: capture card -> OCR -> LLM -> overlay"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    # UI (SPEC 1): Qt 6 + Windows 11 Fluent look
    "PySide6>=6.7",
    "PySide6-Fluent-Widgets>=1.7",
    # Config (SPEC 1): config.yaml + .env with validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "sounddevice>=0.5",
    "psutil>=6",
    "pygrabber>=0.2 ; sys_platform == 'win32'",
    "pyttsx3>=2.90 ; sys_platform == 'win32'",
    "winrt-runtime>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0 ; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0 ; sys_platform == 'win32'",
    "rapidocr>=3.10",
    "onnxruntime>=1.20",
    "google-genai>=3.2",
    "deep-translator>=1.11.4",
    "keyring>=25.7",
    "pynput>=1.8",
    "aiohttp>=3.10",
    "qrcode>=8.0",
    "edge-tts>=7.0",
    "miniaudio>=1.59",
    "mss>=9.0",
]

[project.scripts]
subwizard = "subwizard.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subwizard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "hardware: needs a real capture card / audio device (excluded by default)",
    "ui: needs Qt (runs offscreen)",
    "network: calls a real online service (excluded by default)",
]
addopts = "-m 'not hardware and not network'"
