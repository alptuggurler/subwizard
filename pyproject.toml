[project]
name = "subwizard"
version = "0.1.0"
description = "Live game subtitle translator: capture card -> OCR -> LLM -> overlay"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    # UI (SPEC 1): Qt 6 + Windows 11 Fluent look
    "PySide6>=6.7",
    "PySide6-Fluent-Widgets>=1.7",
    # Config (SPEC 1): config.yaml + .env with validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
]

[project.scripts]
subwizard = "subwizard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subwizard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a real capture card / audio device (excluded by default)",
    "ui: needs Qt (runs offscreen)",
]
addopts = "-m 'not hardware'"
