# SubWizard ornek ayar dosyasi.
# Normal kullanimda bu dosyayi elle duzenlemek gerekmez; arayuz her degisikligi
# kendisi kaydeder. Tum alanlar opsiyoneldir, yazilmayanlar varsayilan degeri alir.

ui:
  language: auto        # auto | tr | en
  theme: dark           # auto | dark | light
  close_to_tray: true   # kapatma butonu tepsiye kucultur
  perf_overlay: 'off'   # off | compact | detailed (F9 sirayla gecer)
  cursor_hide_ms: 2000  # tam ekranda imlec bu kadar hareketsiz kalinca gizlenir
  wizard_done: false    # kurulum sihirbazi bitince true; Ayarlar'dan yeniden acilir

logging:
  level: INFO           # DEBUG | INFO | WARNING | ERROR
  dir: null             # null = kullanici veri klasoru/logs

source:
  kind: capture         # capture (konsol) | file (video) | screen (PC oyunu, capture card yok)
  device: 0             # cihaz index'i veya adi
  path: null            # kind: file icin .mp4 yolu
  width: 1920
  height: 1080
  fps: 60
  fourcc: MJPG
  buffer_size: 1
  loop: true            # kind: file icin klip bitince basa sar
  monitor: 1            # kind: screen - hangi ekran (1 = ilk)
  screen_fps: 10.0      # kind: screen - yalnizca OCR icin; oyunu yormaz
  reconnect_initial_s: 0.5   # cihaz kopunca ilk bekleme (her denemede ikiye katlanir)
  reconnect_max_s: 8.0
  max_read_failures: 30      # art arda bu kadar kare okunamazsa cihaz kopmus sayilir

audio:
  mode: passthrough     # passthrough | off
  input_device: null    # capture card ses girisi (null = secilmedi)
  output_device: null   # null = sistem varsayilani
  sample_rate: 48000
  channels: 2
  profile: balanced     # low | balanced | safe
  profiles:             # block: geri cagri basina ornek; buffer_ms: temel gecikme
    low: {block: 128, buffer_ms: 15}
    balanced: {block: 256, buffer_ms: 30}
    safe: {block: 512, buffer_ms: 60}
  delay_ms: 0           # A/V senkron, -200 .. 500 (ses yalnizca geciktirilebilir)
  gain_db: 0.0          # -60 .. +6
  muted: false
  silence_db: -60.0     # silence_s boyunca bunun altindaysa "ses gelmiyor" uyarisi
  silence_s: 3.0
  clip_db: -0.1         # bu seviyede veya ustunde clipping uyarisi

metrics:
  short_window_s: 2.0
  long_window_s: 60.0
  ui_hz: 4.0            # arayuze saniyede kac kez metrik gider
  fps_warn_ratio: 0.965 # istenen FPS'in bu oraninin alti sari (60 icin 58)
  fps_bad_ratio: 0.8    # alti kirmizi
  frame_age_warn_ms: 20.0
  frame_age_bad_ms: 50.0
  audio_latency_warn_ms: 80.0
  audio_latency_bad_ms: 150.0
  ocr_ms_warn: 250.0    # tek OCR cagrisinin suresi
  ocr_ms_bad: 600.0
  translate_ms_warn: 1000.0   # tek ceviri (onbellekte yoksa)
  translate_ms_bad: 2500.0
  subtitle_ms_warn: 1500.0    # altyazi goruldu -> ceviri ekranda
  subtitle_ms_bad: 3000.0

roi:
  template: bottom_center   # bottom_center | bottom_wide | lower_half | top | custom
  rect: [0.15, 0.78, 0.7, 0.18]   # x, y, genislik, yukseklik (karenin orani, 0-1)
  padding_pct: 4.0          # kesik kelimeler icin alan her yonde bu % kadar buyutulur
  extra_rects: []           # ek alanlar, ana alanla birlikte okunur: [[x, y, w, h], ...]
  exclude_rects: []         # okunmadan once karartilan alanlar (mini harita, HUD)

ocr:
  engine: rapid             # rapid | windows (deneysel: Windows'un kendi OCR'i)
  hz: 4.0                   # saniyede kac kez okunur
  min_confidence: 0.6       # bu guvenin altindaki satirlar atilir
  change_threshold: 2.0     # alan bundan az degistiyse OCR atlanir (0-255 ortalama fark)
  change_thumb_width: 160
  change_mode: bright       # bright: yalnizca parlak (yazi) pikselleri karsilastir; gray: tum alan
  change_bright_min: 180    # "bright" modunda yazi sayilan en dusuk parlaklik (0-255)
  det_max_side: 960         # metin bulma girdisi bu boyuta kucultulur (hiz icin)
  threads: 0                # 0 = otomatik
  preprocess:               # motor basina on isleme
    rapid:
      grayscale: true
      contrast_stretch: false
      threshold: none       # none | otsu | adaptive
      upscale_below_px: 48  # bundan alcak alanlar 2x buyutulur
      white_text_mask: false
      mask_min_value: 180
      mask_max_saturation: 60
    windows:
      grayscale: true
      contrast_stretch: false
      threshold: none
      upscale_below_px: 48
      white_text_mask: false
      mask_min_value: 180
      mask_max_saturation: 60
    tesseract:
      grayscale: true
      contrast_stretch: true
      threshold: otsu
      upscale_below_px: 400
      white_text_mask: false
      mask_min_value: 180
      mask_max_saturation: 60

subtitle:                   # altyazi durum makinesi
  similarity: 0.85          # en az bu kadar benzer metin "ayni satir" sayilir
  stable_repeats: 1         # satir kesinlesmeden once kac kez daha gorulmeli
  empty_ticks: 2            # alan bu kadar okuma bos kalinca altyazi bitti sayilir
  min_chars: 3              # daha kisa metinler gurultu
  min_letter_ratio: 0.5     # harf orani bunun altindaysa gurultu
  ignore_phrases: []        # cevrilmeyecek ifadeler (regex), or. "Press .* to skip"
  skip_foreign: true        # hedef dildeki yazilari (konsol menusu) ve baska alfabeleri ele
  speaker_pattern: "^((?:[A-Z][\\w'.-]*\\s?){1,3}):\\s+"   # "LUCIA: ..." konusmaci adi
  min_display_ms: 1500      # ceviri ekranda en az bu kadar kalir
  ms_per_char: 50           # ...arti cevirinin her karakteri icin bu kadar (0 = hep min_display_ms)
  max_display_ms: 7000      # uzun satir en cok bu kadar kalir
  fast_punctuation: true    # . ! ? ile biten satir ikinci okumayi beklemeden cevrilir
  clean_noise: true         # OCR copu kelimeleri ("ou$3e") ve satir basina yapisan HUD sayisini at
  save_lines: true          # cevrilen satirlari oyuna (profile) gore subtitles.sqlite'a kaydet

translator:
  engine: gemini            # gemini | deep (anahtarsiz, ucretsiz) | test (istek atmaz, okunani gosterir)
  mode: ocr                 # ocr | vision (deneysel: resmi Gemini okur ve cevirir; anahtar ister)
  vision_media_resolution: medium   # low | medium | high (vision: resim basina token)
  model: gemini-3.5-flash-lite
  start_paused: false       # true: ceviri kapali baslar, duraklatma tusu (F8) acip kapatir
  source_language: en
  target_language: tr
  context_lines: 5          # son kac satir baglam olarak gonderilir
  merge_fragments: true     # parca parca gosterilen cumleyi butun olarak cevir
  timeout_s: 2.5            # Gemini istegi bu surede donmezse yedek cevirmen
  retries: 1                # sunucu/ag hatasinda tekrar deneme sayisi
  thinking_level: minimal   # minimal | low | medium | high (dusuk = hizli)
  quota_cooldown_s: 60.0    # kotasi dolan anahtar bu kadar dinlendirilir
  system_prompt: ""         # bos = yerlesik prompt
  fallback: true            # Gemini olmazsa deep-translator kullan
  fallback_timeout_s: 4.0
  offline_after: 3          # art arda bu kadar satir cevrilemezse "baglanti yok" uyarisi
  cache_size: 2000          # bellekteki ceviri onbellegi
  disk_cache: true          # cache/translations.sqlite (oturumlar arasi)
  loose_cache: true         # OCR'in farkli okudugu ayni satir (I/l/1, O/0, bosluk) onbellekten gelir
  prices:                   # USD / 1M token (ucretli katman, 2026-11-12)
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
    gemini-3.6-flash: {input: 0.75, output: 3.75}

overlay:                    # ekrandaki Turkce altyazi (boyutlar videonun %'si)
  visible: true             # F10
  position: replace         # replace (orijinalin yerine, ek yer kaplamaz) | bottom (orijinalin ustu) | top
  font_family: ""           # bos = Segoe UI Variable -> Segoe UI -> Arial
  font_size_pct: 3.5        # video yuksekliginin %'si
  bold: true
  max_width_pct: 80.0       # satir bu genislikte kaydirilir
  margin_pct: 1.5
  text_color: "#FFFFFF"
  background_color: "#000000"
  background_opacity: 0.65
  speaker_color: "#FFD24A"
  outline: true
  auto_bg: true             # replace modunda Ingilizce yazi cevre rengiyle kapatilir
  show_source: false        # Ingilizce satiri da kucuk goster
  history_lines: 10         # F12 paneli
  stack_lines: 2            # 1-3: onceki satir ustte kucuk ve soluk kalir (1 = yalnizca guncel satir)
  fade_ms: 150              # yumusak belirme / kaybolma suresi (0 = efekt yok)

hotkeys:
  global_hotkeys: true      # oyun odaktayken de calisir (Windows, pynput)
  keys:
    calibrate: F2
    copy_last: F5
    mute: F6
    retranslate: F7
    pause_translation: F8
    perf_overlay: F9
    toggle_subtitles: F10
    fullscreen: F11
    history_panel: F12

display:
  mode: window          # window (Mod A) | web (Mod B) | both

web:                    # web overlay (display.mode web/both): telefon, tablet, OBS
  host: 0.0.0.0         # yerel ag; 127.0.0.1 = yalnizca bu PC
  port: 8787
  token: ""             # doluysa sayfalar ve /ws ?t=<token> ister
  font_px: 48           # sayfa varsayilanlari; URL ile degisir: ?font=&lines=&source=
  lines: 3
  show_source: false
  reconnect_ms: 1000    # baglanti koparsa sayfa bu aralikla yeniden dener
  heartbeat_s: 10.0     # WebSocket ping araligi

tts:                    # sesli okuma (deneysel)
  mode: "off"           # off | translation (Turkce ceviriyi oku) | source (Ingilizceyi oku, cevirme)
  engine: auto          # auto: Windows'ta SAPI, macOS'ta say | sapi | say | edge (cevrimici, iyi Turkce ses)
  voice: ""             # bos: dile uygun ilk ses
  rate: 1.0             # 0.5-2.0
  catch_up: skip        # satirlar birikirse: skip (eskileri atla) | speedup (hizlan)

profile: default
debug: false
